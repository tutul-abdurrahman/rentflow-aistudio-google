<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Component — Status Chips | RentFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../design-system/tokens.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      body {
        font-family: var(--font-sans);
        line-height: var(--line-height-body);
      }
    </style>
  </head>
  <body class="min-h-screen bg-(--color-surface) p-6 text-(--color-ink)">
    <main class="mx-auto max-w-2xl">
      <h1 class="text-xl font-bold">Status Chips</h1>
      <p class="mt-1 text-sm text-(--color-ink-faint)">
        Tint background + status color + small dot. Used on dashboards, due
        lists and receipt flows. Semantic mapping: paid=green, partial=amber,
        due=amber+ink, overdue=vermillion, loan/info=teal.
      </p>

      <div
        class="mt-8 flex flex-wrap items-center gap-3 rounded-(--radius-card) border border-(--color-border) bg-(--color-surface-raised) p-(--space-lg)"
      >
        <!-- পরিশোধিত — success -->
        <span
          class="inline-flex items-center gap-1.5 rounded-(--radius-pill) bg-(--color-success-tint) px-3 py-1 text-xs font-medium text-(--color-success)"
        >
          <span class="h-1.5 w-1.5 rounded-full bg-(--color-success)"></span>
          পরিশোধিত
        </span>

        <!-- আংশিক — warning -->
        <span
          class="inline-flex items-center gap-1.5 rounded-(--radius-pill) bg-(--color-warning-tint) px-3 py-1 text-xs font-medium text-(--color-warning)"
        >
          <span class="h-1.5 w-1.5 rounded-full bg-(--color-warning)"></span>
          আংশিক
        </span>

        <!-- বাকি — warning tint + ink text -->
        <span
          class="inline-flex items-center gap-1.5 rounded-(--radius-pill) bg-(--color-warning-tint) px-3 py-1 text-xs font-medium text-(--color-ink)"
        >
          <span class="h-1.5 w-1.5 rounded-full bg-(--color-warning)"></span>
          বাকি
        </span>

        <!-- অতিরিক্ত বকেয়া — danger -->
        <span
          class="inline-flex items-center gap-1.5 rounded-(--radius-pill) bg-(--color-danger-tint) px-3 py-1 text-xs font-medium text-(--color-danger)"
        >
          <span class="h-1.5 w-1.5 rounded-full bg-(--color-danger)"></span>
          অতিরিক্ত বকেয়া
        </span>

        <!-- লোন — info/teal -->
        <span
          class="inline-flex items-center gap-1.5 rounded-(--radius-pill) bg-(--color-info-tint) px-3 py-1 text-xs font-medium text-(--color-info)"
        >
          <span class="h-1.5 w-1.5 rounded-full bg-(--color-info)"></span>
          লোন
        </span>
      </div>
    </main>
  </body>
</html>
