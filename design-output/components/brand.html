<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Component — Brand Mark | RentFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../design-system/tokens.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      body {
        font-family: var(--font-sans);
        line-height: var(--line-height-body);
      }
    </style>
  </head>
  <body class="min-h-screen bg-(--color-surface) text-(--color-ink)">
    <!-- ============================================================
         RentFlow brand mark (canonical)

         Home-icon logo: a ~44px saffron solid circle with an ink house
         outline inside, beside the "RentFlow" wordmark and an optional
         tagline. This is the single source of the RentFlow identity —
         reuse the markup below for the sidebar and auth screens.

         Variants:
         - Centered lockup (auth screens): add
           "flex flex-col items-center text-center" on the wrapper and
           keep the circle + wordmark stacked.
         - Horizontal lockup (sidebar): add
           "flex items-center gap-3" on the wrapper, circle stays 44px,
           wordmark can shrink to text-lg.
         ============================================================ -->
    <main class="mx-auto max-w-3xl px-6 py-12">
      <h1 class="text-xl font-bold text-(--color-ink)">Brand mark</h1>
      <p class="mt-1 max-w-md text-sm text-(--color-ink-faint)">
        Canonical RentFlow logo — home-icon mark (saffron circle + ink home
        icon) beside the wordmark. Reuse this markup in the sidebar and auth
        screens.
      </p>

      <!-- Horizontal lockup (sidebar default) -->
      <div class="mt-8 flex items-center gap-3">
        <span
          class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-(--color-primary) text-(--color-on-primary)"
        >
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 10.5 12 3l9 7.5" />
            <path d="M5 9.5V21h14V9.5" />
          </svg>
        </span>
        <div class="min-w-0">
          <p
            class="truncate text-xl font-bold tracking-tight text-(--color-ink)"
          >
            RentFlow
          </p>
          <p class="truncate text-xs text-(--color-ink-faint)">
            ভাড়া ও বিল ব্যবস্থাপনা
          </p>
        </div>
      </div>

      <!-- Centered lockup (auth screens default) -->
      <div class="mt-10 flex flex-col items-center text-center">
        <span
          class="flex h-11 w-11 items-center justify-center rounded-full bg-(--color-primary) text-(--color-on-primary)"
        >
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 10.5 12 3l9 7.5" />
            <path d="M5 9.5V21h14V9.5" />
          </svg>
        </span>
        <p class="mt-3 text-xl font-bold tracking-tight text-(--color-ink)">
          RentFlow
        </p>
        <p class="mt-0.5 text-sm text-(--color-ink-faint)">
          ভাড়া ও বিল ব্যবস্থাপনা
        </p>
      </div>
    </main>
  </body>
</html>
