<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Component — Radio Card | RentFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../design-system/tokens.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      body {
        font-family: var(--font-sans);
        line-height: var(--line-height-body);
      }
      .radio-card {
        transition:
          border-color var(--motion-fast) var(--ease-standard),
          background-color var(--motion-fast) var(--ease-standard);
      }
      .radio-card .radio-dot {
        border-color: var(--color-border-strong);
        transition:
          border-color var(--motion-fast) var(--ease-standard),
          background-color var(--motion-fast) var(--ease-standard);
      }
      .radio-card .radio-dot > span {
        opacity: 0;
        transition: opacity var(--motion-fast) var(--ease-standard);
      }
      .radio-card.selected {
        border-color: var(--color-border-focus);
        background-color: color-mix(
          in srgb,
          var(--color-primary-tint) 45%,
          var(--color-surface-raised)
        );
      }
      .radio-card.selected .radio-dot {
        border-color: var(--color-primary);
      }
      .radio-card.selected .radio-dot > span {
        opacity: 1;
      }
    </style>
  </head>
  <body class="min-h-screen bg-(--color-surface) p-6 text-(--color-ink)">
    <main class="mx-auto max-w-md">
      <h1 class="text-xl font-bold">Radio Card</h1>
      <p class="mt-1 text-sm text-(--color-ink-faint)">
        Choice list, not a tiny radio. Selected card uses the focus border and a
        saffron-tint mix. Dot is 20px with a 10px fill. Used on adjustment type
        and similar exclusive picks.
      </p>

      <div class="mt-8 grid gap-3">
        <label
          class="radio-card selected flex cursor-pointer items-start gap-3 rounded-(--radius-card) border border-(--color-border) bg-(--color-surface-raised) px-4 py-3.5"
        >
          <input type="radio" name="demo-type" class="sr-only" checked />
          <span
            class="radio-dot mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full border-2"
          >
            <span class="h-2.5 w-2.5 rounded-full bg-(--color-primary)"></span>
          </span>
          <span class="min-w-0 flex-1">
            <span class="block text-sm font-semibold text-(--color-ink)"
              >অতিরিক্ত ইউনিট</span
            >
            <span class="block text-xs text-(--color-ink-muted)"
              >বিদ্যুৎ ইউনিট যোগ হবে — ৳৭.৫/ইউনিট</span
            >
          </span>
        </label>
        <label
          class="radio-card flex cursor-pointer items-start gap-3 rounded-(--radius-card) border border-(--color-border) bg-(--color-surface-raised) px-4 py-3.5"
        >
          <input type="radio" name="demo-type" class="sr-only" />
          <span
            class="radio-dot mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full border-2"
          >
            <span class="h-2.5 w-2.5 rounded-full bg-(--color-primary)"></span>
          </span>
          <span class="min-w-0 flex-1">
            <span class="block text-sm font-semibold text-(--color-ink)"
              >এককালীন চার্জ</span
            >
            <span class="block text-xs text-(--color-ink-muted)"
              >মেরামত, ফাইন বা অন্য কোনো নির্দিষ্ট টাকা</span
            >
          </span>
        </label>
      </div>
    </main>
    <script>
      document.querySelectorAll('.radio-card').forEach((card) => {
        card.addEventListener('click', () => {
          document
            .querySelectorAll('.radio-card')
            .forEach((c) => c.classList.remove('selected'))
          card.classList.add('selected')
        })
      })
    </script>
  </body>
</html>
