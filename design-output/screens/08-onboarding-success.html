<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>সেটআপ সম্পন্ন — RentFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../design-system/tokens.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      body {
        font-family: var(--font-sans);
        line-height: var(--line-height-body);
      }
    </style>
  </head>
  <body class="min-h-screen bg-(--color-surface) text-(--color-ink)">
    <main class="flex min-h-screen flex-col justify-center px-5 py-12">
      <div class="mx-auto w-full max-w-md">
        <!-- Brand lockup (home-icon logo — see components/brand.html) -->
        <div class="flex flex-col items-center text-center">
          <span
            class="flex h-11 w-11 items-center justify-center rounded-full bg-(--color-primary) text-(--color-on-primary)"
          >
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 10.5 12 3l9 7.5" />
              <path d="M5 9.5V21h14V9.5" />
            </svg>
          </span>
          <p class="mt-3 text-xl font-bold tracking-tight text-(--color-ink)">
            RentFlow
          </p>
          <p class="mt-0.5 text-sm text-(--color-ink-faint)">
            ভাড়া ও বিল ব্যবস্থাপনা
          </p>
        </div>

        <!-- Success card -->
        <div
          class="mt-8 rounded-(--radius-card) border border-(--color-border) bg-(--color-surface-raised) p-(--space-xl)"
        >
          <div class="flex flex-col items-center text-center">
            <span
              class="flex h-20 w-20 items-center justify-center rounded-full bg-(--color-primary-tint) text-(--color-primary)"
            >
              <svg
                width="36"
                height="36"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 6 9 17l-5-5" />
              </svg>
            </span>
            <h1 class="mt-5 text-xl font-bold text-(--color-ink)">
              সব ঠিক আছে, রফিক ভাই!
            </h1>
            <p class="mt-1.5 text-sm text-(--color-ink-muted)">
              বাড়ি সেটআপ শেষ। এবার থেকে বিল আর আদায় সব এক জায়গায়।
            </p>

            <!-- Setup summary -->
            <div
              class="mt-6 w-full overflow-hidden rounded-(--radius-md) border border-(--color-border)"
            >
              <div class="flex items-center justify-between gap-3 px-4 py-3">
                <span
                  class="flex min-w-0 items-center gap-2 text-sm text-(--color-ink-muted)"
                >
                  <svg
                    class="shrink-0 text-(--color-primary)"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M3 10.5 12 3l9 7.5" />
                    <path d="M5 9.5V21h14V9.5" />
                  </svg>
                  বাড়ি
                </span>
                <span
                  class="truncate text-right text-sm font-semibold text-(--color-ink)"
                  >আবাসিক ভবন — মিরপুর-১০</span
                >
              </div>
              <div
                class="flex items-center justify-between gap-3 border-t border-(--color-border) px-4 py-3"
              >
                <span
                  class="flex items-center gap-2 text-sm text-(--color-ink-muted)"
                >
                  <svg
                    class="shrink-0 text-(--color-primary)"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                    <path d="M3 12h18M12 3v18" />
                  </svg>
                  রুম
                </span>
                <span class="text-sm font-semibold text-(--color-ink)"
                  >৬টি রুম</span
                >
              </div>
              <div
                class="flex items-center justify-between gap-3 border-t border-(--color-border) px-4 py-3"
              >
                <span
                  class="flex items-center gap-2 text-sm text-(--color-ink-muted)"
                >
                  <svg
                    class="shrink-0 text-(--color-primary)"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z" />
                  </svg>
                  বিদ্যুৎ রেট
                </span>
                <span class="text-sm font-semibold text-(--color-ink)"
                  >৳৭.৫/ইউনিট</span
                >
              </div>
              <div
                class="flex items-center justify-between gap-3 border-t border-(--color-border) px-4 py-3"
              >
                <span
                  class="flex items-center gap-2 text-sm text-(--color-ink-muted)"
                >
                  <svg
                    class="shrink-0 text-(--color-primary)"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M6 7h12l-1 13H7L6 7z" />
                    <path d="M4 4h16v3H4z" />
                    <path d="M9 4a3 3 0 0 1 6 0" />
                  </svg>
                  ওয়েস্ট ফি
                </span>
                <span class="text-sm font-semibold text-(--color-ink)"
                  >৳২০০/রুম/মাস</span
                >
              </div>
            </div>

            <a
              href="02-dashboard.html"
              class="mt-6 inline-flex w-full items-center justify-center gap-2 rounded-(--radius-button) border border-transparent bg-(--color-primary) px-5 py-3 text-base font-semibold text-(--color-on-primary) transition-colors hover:bg-(--color-primary-hover) active:bg-(--color-primary-active)"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M3 10.5 12 3l9 7.5" />
                <path d="M5 9.5V21h14V9.5" />
              </svg>
              ড্যাশবোর্ডে যান
            </a>

            <a
              href="29-settings-hub.html"
              class="mt-2 inline-flex w-full items-center justify-center gap-2 rounded-(--radius-button) border border-(--color-secondary) bg-(--color-surface-raised) px-5 py-3 text-base font-semibold text-(--color-secondary) transition-colors hover:bg-(--color-secondary-hover) active:bg-(--color-secondary-active)"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.09a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                />
              </svg>
              সেটিংস দেখুন
            </a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
