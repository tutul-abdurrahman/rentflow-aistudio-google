<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>বিল তৈরি হয়েছে — RentFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../design-system/tokens.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      body {
        font-family: var(--font-sans);
        line-height: var(--line-height-body);
      }
    </style>
  </head>
  <body
    class="flex min-h-screen flex-col bg-(--color-surface) text-(--color-ink)"
  >
    <main
      class="mx-auto flex w-full max-w-md flex-1 flex-col items-center justify-center px-6 py-12"
    >
      <!-- success mark -->
      <span
        class="flex h-24 w-24 items-center justify-center rounded-full bg-(--color-primary-tint)"
      >
        <svg
          class="text-(--color-primary)"
          width="52"
          height="52"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m4.5 12.5 5 5L20 6.5" />
        </svg>
      </span>

      <h1 class="mt-6 text-2xl font-bold text-(--color-ink)">
        বিল তৈরি হয়েছে
      </h1>
      <p class="mt-1.5 text-sm text-(--color-ink-muted)">
        আগস্ট ২০২৬ · ৫টি বিল · রুম ১০৬ খালি
      </p>

      <p
        class="mt-5 text-4xl font-bold leading-none tracking-tight text-(--color-ink)"
      >
        ৳৫৭,৯৯৮
      </p>
      <p class="mt-2 text-xs text-(--color-ink-faint)">
        সাতান্ন হাজার নয়শ আটানব্বই টাকা মাত্র
      </p>

      <!-- quiet note: loan installment auto-added to one bill -->
      <div
        class="mt-5 flex w-full items-start gap-2.5 rounded-(--radius-card) border border-(--color-border) bg-(--color-surface-raised) px-4 py-3"
      >
        <svg
          class="mt-0.5 shrink-0 text-(--color-primary)"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M12 8h.01M12 11v5" />
        </svg>
        <p class="text-xs leading-relaxed text-(--color-ink-muted)">
          নাফিসার বিলে লোন কিস্তি
          <span class="font-semibold text-(--color-ink)">৳১,০০০</span> যোগ
          হয়েছে
        </p>
      </div>

      <!-- actions -->
      <div class="mt-5 w-full space-y-2.5">
        <a
          href="19-collection-due-list.html"
          class="inline-flex w-full items-center justify-center gap-2 rounded-(--radius-button) bg-(--color-primary) px-5 py-3.5 text-md font-semibold text-(--color-on-primary) transition-colors hover:bg-(--color-primary-hover) active:bg-(--color-primary-active)"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M2 7h20v10H2V7z" />
            <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
            <path d="M6 10h.01M18 14h.01" />
          </svg>
          কালেকশন শুরু করুন
        </a>
        <a
          href="04-receipt-grid-print.html"
          class="inline-flex w-full items-center justify-center gap-2 rounded-(--radius-button) border border-(--color-secondary) bg-(--color-surface-raised) px-5 py-3.5 text-md font-semibold text-(--color-secondary) transition-colors hover:bg-(--color-secondary-hover) active:bg-(--color-secondary-active)"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 9V2h12v7" />
            <path
              d="M6 18H4a1 1 0 0 1-1-1v-5a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v5a1 1 0 0 1-1 1h-2"
            />
            <path d="M6 14h12v8H6z" />
          </svg>
          রিসিট প্রিন্ট
        </a>
        <a
          href="18-manual-adjustment.html"
          class="inline-flex w-full items-center justify-center gap-2 rounded-(--radius-button) px-5 py-3 text-md font-semibold text-(--color-ink-muted) transition-colors hover:bg-(--color-surface-soft) hover:text-(--color-ink)"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 5v14M5 12h14" />
          </svg>
          অ্যাডজাস্টমেন্ট
        </a>
        <a
          href="02-dashboard.html"
          class="inline-flex w-full items-center justify-center gap-2 rounded-(--radius-button) px-5 py-3 text-md font-semibold text-(--color-ink-muted) transition-colors hover:bg-(--color-surface-soft) hover:text-(--color-ink)"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 10.5 12 3l9 7.5" />
            <path d="M5 9.5V21h14V9.5" />
          </svg>
          হোম
        </a>
      </div>
    </main>
  </body>
</html>
